<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Govt. High School Dhurwa</title>

<style>

/* ==============================
   RESET
================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}


/* ==============================
   MAIN SCREEN
================================= */

.screen {
    position: relative;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    background: #000;
}


/* ==============================
   IMAGE CAROUSEL
================================= */

.carousel {
    position: absolute;

    inset: 0;
}


/* Individual slide */

.slide {
    position: absolute;

    inset: 0;

    opacity: 0;

    transform: scale(1.12);

    transition:
        opacity 1.8s ease,
        transform 8s ease;

    overflow: hidden;
}


/* Active image */

.slide.active {
    opacity: 1;

    transform: scale(1);
}


/* ==============================
   IMAGE
================================= */

.slide img {

    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;

    filter:
        brightness(.78)
        saturate(1.15);

}


/* ==============================
   IMAGE ANIMATION
================================= */

.slide.active img {

    animation:
        cinematicZoom 8s ease forwards;

}


@keyframes cinematicZoom {

    0% {
        transform: scale(1);
    }

    100% {
        transform: scale(1.12);
    }

}


/* ==============================
   DARK CINEMATIC OVERLAY
================================= */

.overlay {

    position: absolute;

    inset: 0;

    background:

        linear-gradient(
            to bottom,
            rgba(0,0,0,.65),
            rgba(0,0,0,0) 25%,
            rgba(0,0,0,0) 70%,
            rgba(0,0,0,.55)
        );

    pointer-events: none;

}


/* ==============================
   SCHOOL NAME TOP TAG
================================= */

.school-tag {

    position: absolute;

    z-index: 100;

    top: 22px;

    left: 50%;

    transform: translateX(-50%);

    width: auto;

    min-width: 320px;

    max-width: 90%;

    padding: 12px 35px;

    text-align: center;

    border-radius: 50px;

    /* Glass effect */

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.22),
            rgba(255,255,255,.08)
        );

    border:

        1px solid
        rgba(255,255,255,.55);

    backdrop-filter: blur(12px);

    -webkit-backdrop-filter: blur(12px);

    box-shadow:

        0 8px 30px
        rgba(0,0,0,.5),

        inset 0 0 20px
        rgba(255,255,255,.12);

    /* 3D text */

    color: white;

    font-size:
        clamp(18px, 3vw, 42px);

    font-weight: 1000;

    letter-spacing: 2px;

    white-space: nowrap;

    text-shadow:

        0 2px 0 #7b1d00,

        0 4px 0 #541000,

        0 6px 0 #280700,

        0 0 15px
        rgba(255,215,0,.9);

    background-clip: padding-box;

}


/* ==============================
   COLOR SHINE ON SCHOOL NAME
================================= */

.school-tag::before {

    content: "";

    position: absolute;

    inset: 0;

    border-radius: inherit;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.4),
            transparent
        );

    transform:
        translateX(-100%);

    animation:
        shine 4s infinite;

    pointer-events: none;

}


@keyframes shine {

    0% {
        transform: translateX(-100%);
    }

    45%,
    100% {
        transform: translateX(100%);
    }

}


/* ==============================
   DECORATIVE CORNERS
================================= */

.corner {

    position: absolute;

    z-index: 20;

    width: 90px;
    height: 90px;

    border-color:
        rgba(255,215,0,.85);

    border-style: solid;

    pointer-events: none;

}


.corner.top-left {

    top: 0;
    left: 0;

    border-width:
        5px 0 0 5px;

}


.corner.top-right {

    top: 0;
    right: 0;

    border-width:
        5px 5px 0 0;

}


.corner.bottom-left {

    bottom: 0;
    left: 0;

    border-width:
        0 0 5px 5px;

}


.corner.bottom-right {

    bottom: 0;
    right: 0;

    border-width:
        0 5px 5px 0;

}


/* ==============================
   FLOATING LIGHT PARTICLES
================================= */

.particles {

    position: absolute;

    inset: 0;

    z-index: 10;

    pointer-events: none;

}


.particle {

    position: absolute;

    bottom: -20px;

    width: 4px;
    height: 4px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 8px white,
        0 0 15px #ffe066;

    animation:
        rise linear infinite;

}


@keyframes rise {

    0% {

        transform:
            translateY(0)
            scale(.4);

        opacity: 0;

    }

    20% {
        opacity: .8;
    }

    80% {
        opacity: .8;
    }

    100% {

        transform:
            translateY(-110vh)
            scale(1.5);

        opacity: 0;

    }

}


/* ==============================
   STAR
================================= */

.star {

    position: absolute;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 8px white;

    animation:
        twinkle 2s infinite alternate;

}


@keyframes twinkle {

    0% {
        opacity: .15;
        transform: scale(.5);
    }

    100% {
        opacity: 1;
        transform: scale(1.5);
    }

}


/* ==============================
   BOTTOM PROGRESS BAR
================================= */

.progress {

    position: absolute;

    z-index: 100;

    left: 0;
    bottom: 0;

    height: 4px;

    width: 0%;

    background:

        linear-gradient(
            90deg,
            #ff006e,
            #ffd700,
            #00ffff
        );

    box-shadow:
        0 0 15px
        rgba(255,255,255,.8);

}


/* ==============================
   RESPONSIVE
================================= */

@media(max-width:600px) {

    .school-tag {

        min-width: auto;

        width: 90%;

        padding: 10px 15px;

        font-size: 18px;

        letter-spacing: 1px;

    }

    .corner {

        width: 55px;
        height: 55px;

    }

}

</style>
</head>


<body>


<div class="screen">


    <!-- =================================
         IMAGE CAROUSEL
    ================================== -->

    <div class="carousel">


        <!-- IMAGE 1 -->

        <div class="slide active">

            <img
                src="imgae/one.jpeg"
                alt="School">

        </div>


        <!-- IMAGE 2 -->

        <div class="slide">

            <img
                src="imgae/two.jpeg"
                alt="Students">

        </div>


        <!-- IMAGE 3 -->

        <div class="slide">

            <img
                src="imgae/three.jpeg"
                alt="School Building">

        </div>


        <!-- IMAGE 4 -->

        <div class="slide">

            <img
                src="imgae/four.jpeg"
                alt="School Function">

        </div>


        <!-- IMAGE 5 -->

        <div class="slide">

            <img
                src="imgae/five.jpeg"
                alt="Students Event">

        </div>


        <!-- IMAGE 6 -->

        <div class="slide">

            <img
                src="https://images.unsplash.com/photo-1529070538774-1843cb3265df?auto=format&fit=crop&w=2400&q=95"
                alt="School Activity">

        </div>


        <!-- IMAGE 7 -->

        <div class="slide">

            <img
                src="https://images.unsplash.com/photo-1577896851231-70ef18881754?auto=format&fit=crop&w=2400&q=95"
                alt="Students">

        </div>


    </div>


    <!-- =================================
         CINEMATIC OVERLAY
    ================================== -->

    <div class="overlay"></div>


    <!-- =================================
         SCHOOL NAME
    ================================== -->

    <div class="school-tag">

        GOVT. HIGH SCHOOL DHURWA

    </div>


    <!-- =================================
         DECORATIVE CORNERS
    ================================== -->

    <div class="corner top-left"></div>

    <div class="corner top-right"></div>

    <div class="corner bottom-left"></div>

    <div class="corner bottom-right"></div>


    <!-- =================================
         PARTICLES
    ================================== -->

    <div
        class="particles"
        id="particles">
    </div>


    <!-- =================================
         STARS
    ================================== -->

    <div
        id="stars">
    </div>


    <!-- =================================
         PROGRESS
    ================================== -->

    <div
        class="progress"
        id="progress">
    </div>


</div>



<script>

/* ==========================================
   SETTINGS
========================================== */

const SLIDE_TIME = 6000;


/* ==========================================
   GET SLIDES
========================================== */

const slides =
    document.querySelectorAll(".slide");

const progress =
    document.getElementById("progress");


let current = 0;


/* ==========================================
   SHOW SLIDE
========================================== */

function showSlide(index) {

    slides.forEach((slide, i) => {

        slide.classList.remove("active");

    });


    slides[index].classList.add("active");

}


/* ==========================================
   AUTOMATIC CAROUSEL
========================================== */

function nextSlide() {

    current++;

    if (current >= slides.length) {

        current = 0;

    }

    showSlide(current);

}


/* ==========================================
   PROGRESS BAR
========================================== */

function animateProgress() {

    progress.style.transition = "none";

    progress.style.width = "0%";


    setTimeout(() => {

        progress.style.transition =
            `width ${SLIDE_TIME}ms linear`;

        progress.style.width = "100%";

    }, 50);

}


/* ==========================================
   START
========================================== */

animateProgress();


setInterval(() => {

    nextSlide();

    animateProgress();

}, SLIDE_TIME);


/* ==========================================
   CREATE PARTICLES
========================================== */

const particleContainer =
    document.getElementById("particles");


for (let i = 0; i < 35; i++) {

    const particle =
        document.createElement("div");

    particle.className = "particle";


    particle.style.left =
        Math.random() * 100 + "%";


    particle.style.animationDuration =
        (5 + Math.random() * 8) + "s";


    particle.style.animationDelay =
        Math.random() * 8 + "s";


    const size =
        2 + Math.random() * 5;


    particle.style.width =
        size + "px";

    particle.style.height =
        size + "px";


    particleContainer.appendChild(
        particle
    );

}


/* ==========================================
   CREATE STARS
========================================== */

const starContainer =
    document.getElementById("stars");


for (let i = 0; i < 100; i++) {

    const star =
        document.createElement("div");

    star.className = "star";


    star.style.left =
        Math.random() * 100 + "%";


    star.style.top =
        Math.random() * 100 + "%";


    const size =
        1 + Math.random() * 3;


    star.style.width =
        size + "px";

    star.style.height =
        size + "px";


    star.style.animationDelay =
        Math.random() * 3 + "s";


    starContainer.appendChild(
        star
    );

}


/* ==========================================
   KEYBOARD CONTROL
========================================== */

document.addEventListener(
    "keydown",
    function(event) {


        if (event.key === "ArrowRight") {

            current++;

            if (current >= slides.length) {
                current = 0;
            }

            showSlide(current);

            animateProgress();

        }


        if (event.key === "ArrowLeft") {

            current--;

            if (current < 0) {
                current = slides.length - 1;
            }

            showSlide(current);

            animateProgress();

        }


        /* Full screen */

        if (event.key === "f" ||
            event.key === "F") {

            document.documentElement
                .requestFullscreen();

        }

    }
);


/* ==========================================
   TOUCH / SWIPE
========================================== */

let touchStart = 0;


document.addEventListener(
    "touchstart",
    function(event) {

        touchStart =
            event.touches[0].clientX;

    }
);


document.addEventListener(
    "touchend",
    function(event) {

        const touchEnd =
            event.changedTouches[0].clientX;


        if (touchStart - touchEnd > 60) {

            current++;

            if (current >= slides.length) {
                current = 0;
            }

            showSlide(current);

            animateProgress();

        }


        if (touchEnd - touchStart > 60) {

            current--;

            if (current < 0) {
                current = slides.length - 1;
            }

            showSlide(current);

            animateProgress();

        }

    }
);

</script>

</body>
</html>
